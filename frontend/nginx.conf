server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `backend` via a variable (below) defers
    # the lookup to request-time instead of config-load-time, so nginx still
    # starts (and serves the SPA) even if `backend` isn't up/resolvable yet —
    # e.g. a standalone `docker run` with no compose network, or a startup
    # race before the backend container registers its DNS name.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback: every unknown route -> index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to the backend service (docker-compose internal DNS)
    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE
        proxy_read_timeout 1h;
    }
}
