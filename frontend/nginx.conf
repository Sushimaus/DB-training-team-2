server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving `backend` via a variable (below) defers
    # the lookup to request-time instead of config-load-time, so nginx still
    # starts (and serves the SPA) even if `backend` isn't up/resolvable yet —
    # e.g. a standalone `docker run` with no compose network, or a startup
    # race before the backend container registers its DNS name.
    resolver 127.0.0.11 valid=10s;

    # SPA fallback: every unknown route -> index.html
    location / {
        try_files $uri /index.html;
    }

    # Proxy API to the backend service (docker-compose internal DNS)
    location /api/ {
        set $backend_upstream http://backend:8080;
        # NOTE: proxy_pass has no URI part here on purpose. When proxy_pass's
        # target contains a variable, nginx can't do its usual "replace the
        # matched location prefix" rewrite at config-load time — it falls
        # back to appending the client's ORIGINAL request URI verbatim. A
        # trailing `/api/` here (as a previous version of this file had)
        # doesn't get substituted for anything; it just gets prepended to
        # the untouched `/api/auth/login` from the client, producing
        # `/api/api/auth/login` upstream — which matches no route, falls
        # through Spring Security's catch-all, and returns 401 instead of
        # 404. Since this location only ever matches requests already
        # starting with `/api/`, passing the request straight through
        # (no extra prefix) is exactly right.
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;          # SSE
        proxy_read_timeout 1h;
    }
}
